name: Aggiorna orari e pubblica

on:
  schedule:
    # orari UTC: circa 6:20, 12:20 e 17:20 in Italia (ora solare)
    - cron: "17 5,11,16 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - id: pages
        uses: actions/configure-pages@v5

      - name: Leggi la programmazione dei cinema
        # --prev: se un cinema non risponde, si riusano gli orari pubblicati l'ultima volta
        run: python3 scraper/scrape.py --prev "${{ steps.pages.outputs.base_url }}/data/programmazione.json"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
